# BEGIN model-relay SNI gateway (2026-09-23, LAN clients with broken egress)
# 部署于 ROS (Ubuntu 10.18.8.43)，并入 /etc/nginx/nginx.conf 顶层 stream{} 块。
# 三职责: 443 SNI 透传(模型端点+dsh 域名) / 10808+10809 代理转发到 jetson xray / 29321 TCP 转发
stream {
    resolver 127.0.0.53 223.5.5.5 valid=60s;
    map $ssl_preread_server_name $relay_upstream {
        coding.onlyservice.io                     coding.onlyservice.io:443;
        code.spottyx.xyz                          code.spottyx.xyz:443;
        hq-310p-1-via-vps.dsh.onlyservice.io      hq-310p-1-via-vps.dsh.onlyservice.io:443;
        hq-310p-2-via-vps.dsh.onlyservice.io      hq-310p-2-via-vps.dsh.onlyservice.io:443;
        remote-shili-tunnel.dsh.onlyservice.io    remote-shili-tunnel.dsh.onlyservice.io:443;
        remote-shili.dsh.onlyservice.io           remote-shili.dsh.onlyservice.io:443;
        default                                   127.0.0.1:9;
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $relay_upstream;
    }
    # dsh-remote 网关备用端口（纯 TCP，无 SNI）
    server { listen 29321; proxy_pass 43.167.173.46:29321; }
    # BEGIN jetson-proxy-relay (2026-09-23, -> jetson xray socks/http)
    # 建议加固: 在每个 server 内加 allow 10.18.8.0/24; deny all;
    server { listen 10808; proxy_pass 10.18.8.42:10808; }
    server { listen 10809; proxy_pass 10.18.8.42:10809; }
    # END jetson-proxy-relay
}
# END model-relay SNI gateway
